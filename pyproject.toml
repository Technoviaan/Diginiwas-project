[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "diginiwas-chat-api"
version = "1.0.0"
description = "Niwas AI: DigiNiwas' property concierge chat API."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "langchain-core>=0.3.29",
    "langchain-openai>=0.3.0",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
filterwarnings = [
    # Raised inside Starlette's TestClient, not in this project's code.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "BLE", "UP", "SIM", "RUF"]
ignore = [
    "E501",    # long strings in descriptions and examples read better unwrapped
    "RUF001",  # "…", "–", "₹" are intentional in user-facing text
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]
