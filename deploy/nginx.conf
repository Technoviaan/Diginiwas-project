# Alternative to Caddy, for a server that already runs nginx.
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/diginiwas-chat
#   sudo sed -i 's/api.example.com/YOUR_DOMAIN/' /etc/nginx/sites-available/diginiwas-chat
#   sudo ln -s /etc/nginx/sites-available/diginiwas-chat /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d YOUR_DOMAIN          # adds HTTPS to this file
#
# Then start only the API container:
#   docker compose --env-file .env.production up -d --build api

upstream diginiwas_chat {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;

    # Chat requests are small JSON bodies.
    client_max_body_size 64k;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # The API reads the client IP from this for rate limiting.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Streaming replies: pass each event through immediately.
    location ~ ^/v[0-9]+/chat/stream$ {
        proxy_pass http://diginiwas_chat;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://diginiwas_chat;
        # A turn can take two model calls plus a slow listings API wake-up.
        proxy_read_timeout 120s;
    }
}
